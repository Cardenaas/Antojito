<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antojito · Carrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

    <div class="topbar">
        <a href="menu.html" class="icon-btn">←</a>
        <div class="brand" style="font-size:18px;">Tu carrito</div>
        <a href="login.html" class="icon-btn" title="Cerrar sesión" onclick="cerrarSesion(); return false;">👤</a>
    </div>

    <div class="contenido" id="lista-carrito"></div>

</div>

<script src="script.js"></script>
<script>const sesion = exigirCliente(); if (!sesion) throw new Error('Sesión requerida');</script>
<script>
function render() {
    const carrito = getCarrito();
    const cont = document.getElementById('lista-carrito');

    if (carrito.length === 0) {
        cont.innerHTML = `
            <div class="tarjeta" style="text-align:center; color:var(--charcoal-soft);">
                Tu carrito está vacío.
            </div>
            <a href="menu.html" class="btn btn-primario">Ver el menú</a>`;
        return;
    }

    const filas = carrito.map((item, i) => {
        const prod = getProducto(item.productoId);
        return `
        <div class="tarjeta" style="display:flex; gap:12px; align-items:center;">
            <div style="font-size:30px;">${prod ? prod.emoji : '🍽️'}</div>
            <div style="flex:1;">
                <p style="font-weight:700; font-size:14px;">${prod ? prod.nombre : 'Producto'}</p>
                <p style="font-size:12px; color:var(--charcoal-soft);">${item.nota || 'Sin modificaciones'}</p>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <span class="btn-agregar" style="background:var(--cream-dark); color:var(--charcoal); width:26px; height:26px; font-size:14px;" onclick="cambiar(${i}, -1)">−</span>
                <span style="font-weight:700; font-size:14px;">${item.cantidad}</span>
                <span class="btn-agregar" style="width:26px; height:26px; font-size:14px;" onclick="cambiar(${i}, 1)">+</span>
            </div>
        </div>`;
    }).join('');

    const subtotal = totalCarrito();

    cont.innerHTML = filas + `
        <div class="tarjeta">
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:var(--charcoal-soft);">
                <span>Subtotal</span><span>${fmt(subtotal)}</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px; color:var(--charcoal-soft);">
                <span>Domicilio</span><span>Se calcula en el checkout</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-weight:700; font-size:16px; padding-top:10px; border-top:1px solid var(--line);">
                <span>Total</span><span class="precio">${fmt(subtotal)}</span>
            </div>
        </div>
        <a href="checkout.html" class="btn btn-primario">Continuar al checkout</a>`;
}

function cambiar(i, delta) {
    cambiarCantidadCarrito(i, delta);
    render();
}

render();
</script>
</body>
</html>
